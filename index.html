<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>中二數學 Ch2 恆等式與因式分解 - 課堂單元訓練平台</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body { font-family: 'PingFang HK', 'Microsoft JhengHei', system-ui, -apple-system, sans-serif; background-color: #f8fafc; }
        .math-font { font-family: 'Cambria Math', 'Times New Roman', serif; font-style: italic; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .katex-mock { 
            font-family: 'Cambria Math', 'Times New Roman', serif; 
            font-style: italic; 
            color: #0284c7; 
            font-size: 1.15em; 
            font-weight: 700; 
            letter-spacing: 0.02em;
            margin: 0 2px;
            display: inline-block;
        }
        @keyframes pulse-subtle { 0%, 100% { opacity: 1; } 50% { opacity: 0.85; } }
        .animate-pulse-subtle { animation: pulse-subtle 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        
        @keyframes fade-in { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fade-in 0.25s ease-out forwards; }
        
        input[type=range] {
            -webkit-appearance: none;
            background: transparent;
            width: 100%;
            margin: 8px 0;
        }
        input[type=range]:focus { outline: none; }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none; height: 26px; width: 26px; border-radius: 50%; background: #f59e0b; cursor: pointer; margin-top: -9px; box-shadow: 0 3px 6px rgba(0,0,0,0.3); border: 2px solid white; position: relative; z-index: 10;
        }
        input[type=range]::-webkit-slider-thumb:active { transform: scale(1.1); background: #fbbf24; }
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 8px; cursor: pointer; background: #334155; border-radius: 4px; border: 1px solid #1e293b; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const T = (lang, zh, en) => lang === 'zh' ? zh : en;

        // SVG 圖示組件
        const IconCheck = () => <svg className="w-4 h-4 text-emerald-500 inline-block flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="3" d="M5 13l4 4L19 7" /></svg>;
        const IconCross = () => <svg className="w-4 h-4 text-rose-500 inline-block flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="3" d="M6 18L18 6M6 6l12 12" /></svg>;
        const IconRefresh = () => <svg className="w-5 h-5 inline-block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" /></svg>;
        const IconLightbulb = () => <svg className="w-4 h-4 text-amber-500 inline-block mr-1 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20"><path d="M11 3a1 1 0 10-2 0v1a1 1 0 102 0V3zM15.657 5.757a1 1 0 00-1.414-1.414l-.707.707a1 1 0 001.414 1.414l.707-.707zM18 10a1 1 0 01-1 1h-1a1 1 0 110-2h1a1 1 0 011 1zM5.05 6.464A1 1 0 106.464 5.05l-.707-.707a1 1 0 00-1.414 1.414l.707.707zM5 10a1 1 0 01-1 1H3a1 1 0 110-2h1a1 1 0 011 1zM8 16v-1h4v1a2 2 0 11-4 0zM12 14H8a4 4 0 01-3.496-5.961C5.163 6.828 6.5 5.5 8.25 5.5h3.5c1.75 0 3.087 1.328 3.746 2.539A4 4 0 0112 14z" /></svg>;
        const IconMenu = () => <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 6h16M4 12h16M4 18h16" /></svg>;
        const IconArrowRight = () => <svg className="w-4 h-4 inline-block ml-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M14 5l7 7m0 0l-7 7m7-7H3" /></svg>;

        const getLessonSyllabus = (lang) => [
            { id: "LO", title: T(lang, "LO 重溫多項式加減乘除", "L0 Revision: Polynomial Operations"), category: T(lang, "恆等式基礎", "Identity Basics"), desc: T(lang, "鞏固同類項合併、同底數相乘及多項式展開基本功。", "Consolidate basics of combining like terms and polynomial expansion.") },
            { id: "L1", title: T(lang, "L1 2.1 證明恆等式", "L1 2.1 Proving Identities"), category: T(lang, "恆等式基礎", "Identity Basics"), desc: T(lang, "學習比較左方與右方證明恆等式。嚴格遵循『左方 = …』、『右方 = …』及『∵ / ∴』結論格式。", "Learn to prove identities by comparing L.H.S. and R.H.S., using ∵ and ∴.") },
            { id: "L2_L3", title: T(lang, "L2-L3 2.1 恆等式求未知常數 A, B", "L2-L3 2.1 Finding Unknowns A, B in Identities"), category: T(lang, "恆等式基礎", "Identity Basics"), desc: T(lang, "展開左方後，透過『比較同類項 (Comparing like terms)』求未知常數 A 及 B。", "Expand L.H.S. and find unknowns A and B by comparing like terms.") },
            { id: "L4", title: T(lang, "L4 2.2 a² - b² 平方差展開", "L4 2.2 a² - b² Difference of Two Squares"), category: T(lang, "展開公式", "Expansion Formulas"), desc: T(lang, "掌握平方差展開法，強調必須先寫出 ( )² - ( )² 中間步驟。", "Master difference of two squares expansion, emphasizing the ( )² - ( )² step.") },
            { id: "L5", title: T(lang, "L5 2.2 (a±b)² 完全平方展開", "L5 2.2 (a±b)² Perfect Square Expansion"), category: T(lang, "展開公式", "Expansion Formulas"), desc: T(lang, "運用完全平方公式展開，必須先列出 a² ± 2ab + b² 中間步驟。", "Use perfect square formula for expansion, listing the a² ± 2ab + b² step first.") },
            { id: "L6_L1", title: T(lang, "Ch2.3 L1 因式分解 - 抽公因數/項", "Ch2.3 L1 Factorization - Common Factor"), category: T(lang, "因式分解", "Factorization"), desc: T(lang, "利用短除法視覺化尋找數值與字母的最大公因式 (HCF) 並進行提取。", "Use short division to visually find and extract the HCF of numbers and variables.") },
            { id: "L2_BRACKET", title: T(lang, "Ch2.3 L2 因式分解 - 抽公因括號", "Ch2.3 L2 Factorization - Common Bracket"), category: T(lang, "因式分解", "Factorization"), desc: T(lang, "識別多項式中的共同括號項，如 (x + y)，並將其整體提取。", "Identify common bracket terms like (x + y) and extract them.") },
            { id: "L3_GROUPING", title: T(lang, "Ch2.3 L3 因式分解 - 併項法 (4項)", "Ch2.3 L3 Factorization - Grouping (4 terms)"), category: T(lang, "因式分解", "Factorization"), desc: T(lang, "把四項式分為兩兩一組，分別抽公因式後再抽共同括號。", "Group 4 terms into pairs, extract common factors then common brackets.") },
            { id: "L4_REVIEW", title: T(lang, "Ch2.3 L4 綜合重溫 - 短除法抽項", "Ch2.3 L4 Review - Short Division"), category: T(lang, "因式分解", "Factorization"), desc: T(lang, "利用短除法視覺化提取多項式的最大公因數與公因式 (HCF)。", "Use short division to visually extract HCF from polynomials.") },
            { id: "L5_DIFF_SQ", title: T(lang, "Ch2.3 L5 因式分解 - 平方差 a² - b²", "Ch2.3 L5 Factorization - a² - b²"), category: T(lang, "因式分解", "Factorization"), desc: T(lang, "將多項式寫成 ( )² - ( )² 後分解為 (a + b)(a - b)。", "Rewrite polynomials as ( )² - ( )² and factorize to (a + b)(a - b).") },
            { id: "L6_PERF_SQ", title: T(lang, "Ch2.3 L6 因式分解 - 完全平方 (3式)", "Ch2.3 L6 Factorization - Perfect Square (3 terms)"), category: T(lang, "因式分解", "Factorization"), desc: T(lang, "識別三項式是否符合 a² ± 2ab + b² 型態並化為 (a ± b)²。", "Check if trinomial fits a² ± 2ab + b² structure and factorize to (a ± b)².") },
            { id: "L7_MIXED3", title: T(lang, "Ch2.3 L7 因式分解 - 溫習三式", "Ch2.3 L7 Factorization - Mixed 3 types"), category: T(lang, "綜合進階", "Adv. Comprehensive"), desc: T(lang, "靈活運用抽公因式、平方差及完全平方進行徹底分解。", "Flexibly apply HCF, difference of squares, and perfect squares for complete factorization.") },
            { id: "L8_STRUCT", title: T(lang, "Ch2.3 L8 因式分解大集合 - (a)(b)連貫題", "Ch2.3 L8 Factorization - (a)(b) Structural"), category: T(lang, "綜合進階", "Adv. Comprehensive"), desc: T(lang, "解答公開試常見 (a) 先分解基礎式，(b) 善用 (a) 結果解複雜式。", "Solve common exam structural questions: (a) base factorization, (b) apply (a) to complex term.") },
            { id: "L9_DIFF_EX", title: T(lang, "Ch2.3 L9 區分因式分解與展開 & 級測", "Ch2.3 L9 Distinguish Expand & Factorize"), category: T(lang, "綜合進階", "Adv. Comprehensive"), desc: T(lang, "精準分辨「展開 Expand」與「因式分解 Factorize」的反向操作。", "Accurately distinguish between the reverse operations: Expand vs Factorize.") }
        ];

        const COPRIME_PAIRS = [[2,3], [2,5], [3,4], [3,5], [3,7], [3,8], [4,5], [4,7], [4,9], [5,6], [5,7], [5,8], [5,9], [7,8], [7,9], [8,9]];

        const generateQuestionBank = (lang) => {
            const LESSON_SYLLABUS = getLessonSyllabus(lang);
            const list = [];
            let qId = 1;

            const prng = (seed) => { let x = Math.sin(seed) * 10000; return x - Math.floor(x); };
            const getInt = (seed, offset, min, max) => min + Math.floor(prng(seed + offset) * (max - min + 1));
            const getChoice = (seed, offset, arr) => arr[Math.floor(prng(seed + offset) * arr.length)];

            const makeDistractors = (correct, f1, f2, f3, seedOffset) => {
                const set = new Set([correct, f1, f2, f3]);
                const arr = Array.from(set);
                let counter = 1;
                while(arr.length < 4) { arr.push(correct + ' '.repeat(counter)); counter++; }
                return arr.sort(() => prng(seedOffset + qId) - 0.5);
            };

            const formatTerm = (coef, variable, isFirst = false) => {
                if (coef === 0) return "";
                const sign = coef > 0 ? (isFirst ? "" : "+ ") : (isFirst ? "-" : "- ");
                const absCoef = Math.abs(coef);
                const numStr = (absCoef === 1 && variable !== "") ? "" : absCoef;
                return `${sign}${numStr}${variable}`;
            };

            LESSON_SYLLABUS.forEach((lesson, lIdx) => {
                for (let i = 1; i <= 30; i++) {
                    const seed = lIdx * 10000 + i * 100;
                    let qData = {};
                    
                    const swap = prng(seed) > 0.5;
                    const hintMsg = `<br/><span class="text-indigo-600 font-bold mt-1 inline-block">💡 ${T(lang, '提示：(A)(B) 與 (B)(A) 因式乘積完全相同。', 'Note: (A)(B) and (B)(A) factors are identical.')}</span>`;

                    if (lesson.id === "LO") {
                        const a = getInt(seed,1, 2, 7);
                        const b = getInt(seed,2, 1, 9);
                        const c = getInt(seed,3, 2, 5);
                        const d = getInt(seed,4, 1, 4);
                        const e = getInt(seed,5, 1, 8);
                        const rawExpr = `${a}(x + ${b}) - ${c}(${d===1?'':d}x - ${e})`;
                        const step1Corr = `${a}x + ${a*b} - ${c*d}x + ${c*e}`;
                        const finalAns = `${formatTerm(a - c*d, 'x', true)} ${formatTerm(a*b + c*e, '', false)}`.trim();
                        qData = {
                            rawExpr: rawExpr,
                            title: `${T(lang, '化簡多項式：', 'Simplify polynomial: ')}<span class="katex-mock">${rawExpr}</span>`,
                            steps: [
                                {
                                    prompt: T(lang, "選出展開括號後的中間式：", "Select correct expression after expanding brackets:"),
                                    correct: step1Corr,
                                    options: makeDistractors(step1Corr, `${a}x + ${b} - ${c*d}x - ${e}`, `${a}x + ${a*b} - ${c*d}x - ${c*e}`, `${a}x + ${a*b} + ${c*d}x + ${c*e}`, seed),
                                    explanation: `${T(lang, '展開：', 'Expanding: ')}${a}×x + ${a}×${b} - ${c}×${d}x - ${c}×(-${e}) = ${step1Corr}${T(lang, '。注意負負得正！', '. Note: negative times negative gives positive!')}`
                                },
                                {
                                    prompt: T(lang, "合併同類項，得出最終簡化答案：", "Combine like terms for final answer:"),
                                    correct: finalAns,
                                    options: makeDistractors(finalAns, `${formatTerm(a + c*d, 'x', true)} ${formatTerm(a*b - c*e, '', false)}`.trim(), `${formatTerm(a - c*d, 'x', true)} ${formatTerm(a*b - c*e, '', false)}`.trim(), `${formatTerm(a + c*d, 'x', true)} ${formatTerm(a*b + c*e, '', false)}`.trim(), seed+1),
                                    explanation: `${T(lang, 'x 項：', 'x terms: ')}(${a} - ${c*d})x = ${a - c*d}x${T(lang, '；常數項：', '; Constant: ')}${a*b} + ${c*e} = ${a*b + c*e}。`
                                }
                            ]
                        };
                    } else if (lesson.id === "L1") {
                        const k = getInt(seed,1, 2, 9);
                        const c = getInt(seed,2, 2, 8);
                        const b = getInt(seed,3, 1, 9);
                        
                        const unexpandedLHS = `${k}(x - ${b}) + ${c}x`;
                        const expandedLHS = `${k}x - ${k*b} + ${c}x`;
                        const finalLHS = `${k+c}x - ${k*b}`;

                        const lhsLabel = lang === 'zh' ? "左方" : "L.H.S.";
                        const rhsLabel = lang === 'zh' ? "右方" : "R.H.S.";
                        
                        // 使用三點表示法
                        const thereforeStr = "∴";
                        const becauseStr = "∵";

                        const step1Corr = `${lhsLabel} = ${unexpandedLHS}`;
                        const step2Corr = `= ${expandedLHS}<br/>= ${finalLHS}`;
                        const step3Corr = `${rhsLabel} = ${finalLHS}<br/>${becauseStr} ${lhsLabel} = ${rhsLabel}<br/>${thereforeStr} ${unexpandedLHS} ≡ ${finalLHS}`;

                        qData = {
                            rawExpr: `${unexpandedLHS} ≡ ${finalLHS}`,
                            title: `${T(lang, '證明恆等式：', 'Prove identity: ')}<span class="katex-mock">${unexpandedLHS} ≡ ${finalLHS}</span>`,
                            steps: [
                                { 
                                    prompt: T(lang, "1. 抄寫等式的左方 (左方 = …)：", "1. Write down L.H.S. (L.H.S. = …):"), 
                                    correct: step1Corr, 
                                    options: makeDistractors(step1Corr, `${lhsLabel} = ${expandedLHS}`, `${lhsLabel} = ${finalLHS}`, `${lhsLabel} = ${k}x + ${c}x`, seed), 
                                    explanation: T(lang, "第一步先抄下左邊原式，暫不展開。", "First step is to write down L.H.S. as given.") 
                                },
                                { 
                                    prompt: T(lang, "2. 展開左方並化簡 (等於符號對齊)：", "2. Expand and simplify L.H.S. (aligning = signs):"), 
                                    correct: step2Corr, 
                                    options: makeDistractors(step2Corr, `= ${k}x - ${b} + ${c}x<br/>= ${k+c}x - ${b}`, `= ${k}x + ${k*b} + ${c}x<br/>= ${k+c}x + ${k*b}`, `= ${k}x - ${k*b} - ${c}x<br/>= ${k-c}x - ${k*b}`, seed+1), 
                                    explanation: T(lang, `展開 ${k}(x - ${b}) = ${k}x - ${k*b}，換行對齊等於符號，合併得 ${finalLHS}。`, `Expand to ${expandedLHS}, aligning '=' on next line to get ${finalLHS}.`) 
                                },
                                { 
                                    prompt: T(lang, "3. 寫出右方，比較左方與右方並用『∵、∴』作結：", "3. Write down R.H.S., compare with ∵ and ∴ to conclude:"), 
                                    correct: step3Corr, 
                                    options: [
                                        step3Corr,
                                        `${rhsLabel} = ${finalLHS}<br/>${becauseStr} ${lhsLabel} ≠ ${rhsLabel}<br/>${thereforeStr} ${unexpandedLHS} ≢ ${finalLHS}`,
                                        `${rhsLabel} = ${finalLHS}<br/>${becauseStr} ${lhsLabel} = ${rhsLabel}<br/>${thereforeStr} ${T(lang, "該方程不是恆等式", "the equation is not an identity")}`,
                                        `${rhsLabel} = ${finalLHS}<br/>${thereforeStr} ${T(lang, "當且僅當 x = 0 時 左方 = 右方", "L.H.S. = R.H.S. only when x = 0")}`
                                    ], 
                                    explanation: T(lang, `寫出右方 = ${finalLHS}。因為 (∵) 左方 = 右方，所以 (∴) 原式 ≡ 右方 成立，該方程是恆等式。`, `R.H.S. = ${finalLHS}. Since (∵) L.H.S. = R.H.S., therefore (∴) the identity is proved.`) 
                                }
                            ]
                        };
                    } else if (lesson.id === "L2_L3") {
                        const A = getInt(seed,1, 2, 7);
                        const p = getInt(seed,2, 1, 7);
                        const isBNegative = prng(seed + 3) > 0.5;
                        const B_abs = getInt(seed,4, 1, 9);
                        const signB = isBNegative ? '-' : '+';
                        const c = A;
                        const d = isBNegative ? (A * p - B_abs) : (A * p + B_abs);
                        
                        const unexpandedLHS = `A(x + ${p}) ${signB} B`;
                        const expandedLHS = `Ax + ${p}A ${signB} B`;
                        const rhsStr = `${c}x ${d >= 0 ? '+' : '-'} ${Math.abs(d)}`;

                        const lhsLabel = lang === 'zh' ? "左方" : "L.H.S.";
                        const compareMsg = lang === 'zh' ? "比較同類項 (Comparing like terms)" : "Comparing like terms";

                        const step1Corr = `${lhsLabel} = ${unexpandedLHS}`;
                        const step2Corr = `= ${expandedLHS}`;
                        const step3Corr = lang === 'zh' ? `比較同類項：<br/>x 的係數：A = ${c}` : `Comparing like terms:<br/>Coeff. of x: A = ${c}`;
                        const step4Corr = lang === 'zh' ? `比較同類項：<br/>常數項：${p}A ${signB} B = ${d}<br/>代入 A = ${c}，解得 B = ${B_abs}` : `Comparing like terms:<br/>Constant term: ${p}A ${signB} B = ${d}<br/>Sub. A = ${c}, B = ${B_abs}`;

                        qData = {
                            rawExpr: `${unexpandedLHS} ≡ ${rhsStr}`,
                            title: `${T(lang, '已知恆等式 ', 'Given identity ')}<span class="katex-mock">${unexpandedLHS} ≡ ${rhsStr}</span>${T(lang, '，求未知常數 A 及 B。', ', find unknowns A and B.')}`,
                            steps: [
                                { prompt: T(lang, "1. 抄寫左方 (左方 = …)：", "1. Write down L.H.S. (L.H.S. = …):"), correct: step1Corr, options: makeDistractors(step1Corr, `${lhsLabel} = Ax + ${p} ${signB} B`, `${lhsLabel} = ${expandedLHS}`, `${lhsLabel} = A(x) ${signB} B`, seed), explanation: T(lang, "抄下左邊原式。", "Write down L.H.S.") },
                                { prompt: T(lang, "2. 展開左方 (等於符號對齊)：", "2. Expand L.H.S. (aligning = sign):"), correct: step2Corr, options: makeDistractors(step2Corr, `= Ax ${signB} B`, `= A(x + ${p}) ${signB} B`, `= Ax + ${p} ${signB} B`, seed+1), explanation: T(lang, `展開得 = ${expandedLHS}。`, `Expanded form is = ${expandedLHS}.`) },
                                { prompt: T(lang, `3. ${compareMsg}，比較 x 的係數求 A：`, `3. ${compareMsg}, compare coeff. of x to find A:`), correct: step3Corr, options: makeDistractors(step3Corr, lang==='zh'?`比較同類項：<br/>x 的係數：A = ${c+2}`:`Comparing like terms:<br/>Coeff. of x: A = ${c+2}`, lang==='zh'?`比較同類項：<br/>x 的係數：A = ${p}`:`Comparing like terms:<br/>Coeff. of x: A = ${p}`, lang==='zh'?`比較同類項：<br/>x 的係數：A = 0`:`Comparing like terms:<br/>Coeff. of x: A = 0`, seed+3), explanation: T(lang, `比較同類項：左方 x 係數為 A，右方為 ${c}，故 A = ${c}。`, `Comparing like terms: x coeff is A on L.H.S., ${c} on R.H.S., so A = ${c}.`) },
                                { prompt: T(lang, `4. ${compareMsg}，比較常數項並代入 A = ${c} 求 B：`, `4. ${compareMsg}, compare constant terms with A = ${c} to find B:`), correct: step4Corr, options: makeDistractors(step4Corr, lang==='zh'?`比較同類項：<br/>常數項：${p}A ${signB} B = ${d}<br/>解得 B = ${B_abs + 2}`:`Comparing like terms:<br/>Constant term: B = ${B_abs + 2}`, lang==='zh'?`比較同類項：<br/>常數項：${p}A ${signB} B = ${d}<br/>解得 B = -${B_abs}`:`Comparing like terms:<br/>Constant term: B = -${B_abs}`, lang==='zh'?`比較同類項：<br/>常數項：B = ${d}`:`Comparing like terms:<br/>Constant term: B = ${d}`, seed+4), explanation: T(lang, `比較同類項：常數項為 ${p}A ${signB} B = ${d}。代入 A=${c}，解得 B = ${B_abs}。`, `Comparing like terms: constant term is ${p}A ${signB} B = ${d}. Substitute A=${c}, B = ${B_abs}.`) }

                        <p className="text-xs sm:text-sm text-slate-600 mb-3">

                        </p>

                        <div className="flex flex-wrap gap-1.5 mb-3">
                            <button onClick={() => setSdStep(0)} className={`px-2.5 py-1 rounded-lg text-xs font-bold transition ${sdStep === 0 ? 'bg-amber-600 text-white' : 'bg-slate-100 text-slate-700 hover:bg-slate-200'}`}>

                        </div>

                        <div className="bg-slate-900 text-white p-4 sm:p-5 rounded-xl shadow-inner flex flex-col md:flex-row items-center justify-around gap-4">
                            <div className="font-mono text-sm sm:text-base flex flex-col items-start bg-slate-800 p-4 rounded-lg border border-slate-700 w-full max-w-md">
                                {!isBracket ? (
                                    <>
                                        <div className="flex items-end w-full">
                                            <div className={`px-2.5 py-0.5 font-bold border-r-2 border-b-2 rounded-bl-sm transition-all ${sdStep >= 1 ? 'text-amber-400 border-amber-400 bg-amber-950/50' : 'text-slate-600 border-slate-700'}`}>

                                            <div className={`px-2.5 py-0.5 font-bold border-r-2 border-b-2 rounded-bl-sm transition-all ${sdStep >= 2 ? 'text-amber-400 border-amber-400 bg-amber-950/50' : 'text-slate-600 border-slate-700'}`}>
                                                {sdStep >= 2 ? "x" : "?"}
                                            </div>
                                            <div className="px-3 py-0.5 font-bold text-slate-200 border-b-2 border-amber-400 flex-1">
                                                {sdStep >= 1 ? "2x² + 3xy" : "..."}
                                            </div>
                                        </div>
                                        <div className="flex items-center w-full">
                                            <div className="w-16"></div>
                                            <div className={`px-3 py-1 font-bold flex-1 transition-all ${sdStep >= 3 ? 'text-emerald-400' : 'text-slate-600'}`}>
                                                {sdStep >= 2 ? "2x + 3y" : "..."}
                                            </div>

                                    </>
                                ) : (
                                    <>
                                        <div className="flex items-end w-full">
                                            <div className={`px-2.5 py-0.5 font-bold border-r-2 border-b-2 rounded-bl-sm transition-all ${sdStep >= 1 ? 'text-indigo-400 border-indigo-400 bg-indigo-950/50' : 'text-slate-600 border-slate-700'}`}>
                                                {sdStep >= 1 ? "(x + y)" : "?"}

                                    <span className="font-bold text-amber-400 block mb-0.5">
                                        {T(lang, `步驟 ${sdStep + 1} 指引：`, `Step ${sdStep + 1} Guide:`)}
                                    </span>
                                    {!isBracket ? (
                                        sdStep === 0 ? T(lang, "準備進行短除法，寫出 12x² + 18xy。", "Prepare for short division: 12x² + 18xy.") :
                                        sdStep === 1 ? T(lang, "數值 12 與 18 的 HCF 為 6。剩餘 2x² + 3xy。", "HCF of 12 & 18 is 6. Leaves 2x² + 3xy.") :
                                        sdStep === 2 ? T(lang, "字母項 2x² 與 3xy 抽出 x。剩餘 2x + 3y。", "Extract x from variables. Leaves 2x + 3y.") :
                                        T(lang, "左側 HCF 相乘 × 底部剩餘項 = 6x(2x + 3y)。", "Multiply left HCF with bottom terms = 6x(2x + 3y).")
                                    ) : (
                                        sdStep === 0 ? T(lang, "原式：a(x + y) + b(x + y)。", "Original: a(x + y) + b(x + y).") :
                                        sdStep === 1 ? T(lang, "將 (x + y) 視為一個公因式整體抽出。剩餘 a + b。", "Extract (x + y) as common factor. Leaves a + b.") :
                                        T(lang, "組合得：(x + y)(a + b)。", "Combined result: (x + y)(a + b).")
                                    )}
                                </div>
                            </div>
                        </div>
                    </div>
                );
            }

            if (lessonId === "L1" || lessonId === "L2_L3") {
                // 恆等式例子：2(x + 3) + 3(x - 1) ≡ 5x + 3
                // 普通方程例子：2x + 1 = 3 (只有 x = 1 時成立)
                const isIdentityMode = mode === 'identity';

                // 計算 LHS 與 RHS
                const lhsVal = isIdentityMode ? (2 * (xVal + 3) + 3 * (xVal - 1)) : (2 * xVal + 1);
                const rhsVal = isIdentityMode ? (5 * xVal + 3) : 3;

                const isEqual = lhsVal === rhsVal;

                // SVG 坐標圖參數 mapping (x: -3~5 -> 20~280, y: -5~25 -> 180~20)
                const mapX = (val) => 20 + ((val + 3) / 8) * 260;
                const mapY = (val) => 180 - ((val + 5) / 30) * 160;

                const cx = mapX(xVal);
                const cyLHS = mapY(lhsVal);
                const cyRHS = mapY(rhsVal);

                const lhsExprStr = isIdentityMode ? "2(x + 3) + 3(x - 1)" : "2x + 1";
                const rhsExprStr = isIdentityMode ? "5x + 3" : "3";

                return (
                    <div className="bg-white text-slate-800 p-4 sm:p-6 rounded-2xl shadow-sm border border-indigo-200 mb-5 animate-fade-in">
                        <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2 mb-3">
                            <div>
                                <h3 className="text-base sm:text-lg font-bold text-indigo-900 flex items-center gap-1.5">
                                    <IconLightbulb /> {T(lang, "恆等式 (Identity) vs 條件方程 (Equation) 幾何視覺化", "Identity vs Equation Visualizer")}
                                </h3>
                                <p className="text-xs text-slate-500 mt-0.5">
                                    {T(lang, "拉動滑桿改變 x，觀察 L.H.S. 與 R.H.S. 兩條圖像是否【完全重合】", "Drag slider to change x and observe if L.H.S. and R.H.S. coincide completely")}
                                </p>
                            </div>
                            <div className="flex items-center gap-1 bg-slate-100 p-1 rounded-xl self-start sm:self-auto">
                                <button 
                                    onClick={() => setMode('identity')}
                                    className={`px-3 py-1 text-xs font-bold rounded-lg transition-all ${isIdentityMode ? 'bg-indigo-600 text-white shadow' : 'text-slate-600 hover:text-slate-900'}`}
                                >
                                    {T(lang, "恆等式 ≡ (Identity)", "Identity ≡")}
                                </button>
                                <button 
                                    onClick={() => setMode('equation')}
                                    className={`px-3 py-1 text-xs font-bold rounded-lg transition-all ${!isIdentityMode ? 'bg-amber-600 text-white shadow' : 'text-slate-600 hover:text-slate-900'}`}
                                >
                                    {T(lang, "條件方程 = (Equation)", "Equation =")}
                                </button>
                            </div>
                        </div>

                        {/* 圖像與控制面板 */}
                        <div className="grid grid-cols-1 md:grid-cols-12 gap-4 bg-slate-900 text-white p-4 sm:p-5 rounded-2xl shadow-inner">
                            {/* 左側 SVG 坐標圖 */}
                            <div className="md:col-span-6 flex flex-col items-center justify-center bg-slate-950 p-3 rounded-xl border border-slate-800">
                                <div className="text-[11px] text-slate-400 mb-1 flex items-center justify-between w-full font-mono">
                                    <span>y = L.H.S. (藍) vs y = R.H.S. (綠)</span>
                                    <span className={isEqual ? 'text-emerald-400 font-bold' : 'text-rose-400 font-bold'}>
                                        {isEqual ? T(lang, "✓ 兩點/曲線重合", "✓ Points Coincide") : T(lang, "✗ 兩點分離", "✗ Points Separated")}
                                    </span>
                                </div>
                                <svg className="w-full h-48 max-w-[320px]" viewBox="0 0 300 200">
                                    {/* 網格與座標軸 */}
                                    <line x1="20" y1="180" x2="280" y2="180" stroke="#334155" strokeWidth="1.5" />
                                    <line x1="20" y1="20" x2="20" y2="180" stroke="#334155" strokeWidth="1.5" />
                                    <text x="285" y="184" fill="#94a3b8" fontSize="10">x</text>
                                    <text x="15" y="15" fill="#94a3b8" fontSize="10">y</text>

                                    {/* 刻度標記 */}
                                    {[-2, 0, 2, 4].map(val => (
                                        <g key={val}>
                                            <line x1={mapX(val)} y1="177" x2={mapX(val)} y2="183" stroke="#64748b" strokeWidth="1" />
                                            <text x={mapX(val)} y="194" fill="#64748b" fontSize="9" textAnchor="middle">{val}</text>
                                        </g>
                                    ))}

                                    {/* LHS 函數線 */}
                                    {isIdentityMode ? (
                                        <line x1={mapX(-3)} y1={mapY(-12)} x2={mapX(5)} y2={mapY(28)} stroke="#38bdf8" strokeWidth="3" strokeDasharray="4,2" />
                                    ) : (
                                        <line x1={mapX(-3)} y1={mapY(-5)} x2={mapX(5)} y2={mapY(11)} stroke="#38bdf8" strokeWidth="2.5" />
                                    )}

                                    {/* RHS 函數線 */}
                                    {isIdentityMode ? (
                                        <line x1={mapX(-3)} y1={mapY(-12)} x2={mapX(5)} y2={mapY(28)} stroke="#34d399" strokeWidth="2" />
                                    ) : (
                                        <line x1={mapX(-3)} y1={mapY(3)} x2={mapX(5)} y2={mapY(3)} stroke="#34d399" strokeWidth="2.5" />
                                    )}

                                    {/* 垂直指示線 */}
                                    <line x1={cx} y1="20" x2={cx} y2="180" stroke="#f59e0b" strokeWidth="1" strokeDasharray="2,2" />

                                    {/* 動態點 */}
                                    {isIdentityMode ? (
                                        // 恆等式模式：藍綠重合點
                                        <g>
                                            <circle cx={cx} cy={cyLHS} r="7" fill="#f59e0b" className="animate-ping opacity-75" />
                                            <circle cx={cx} cy={cyLHS} r="6" fill="#10b981" stroke="#ffffff" strokeWidth="2" />
                                        </g>
                                    ) : (
                                        // 條件方程模式：兩個獨立點
                                        <g>
                                            <circle cx={cx} cy={cyLHS} r="5" fill="#38bdf8" stroke="#ffffff" strokeWidth="1.5" />
                                            <circle cx={cx} cy={cyRHS} r="5" fill="#34d399" stroke="#ffffff" strokeWidth="1.5" />
                                            {!isEqual && (
                                                <line x1={cx} y1={cyLHS} x2={cx} y2={cyRHS} stroke="#f43f5e" strokeWidth="2" />
                                            )}
                                        </g>
                                    )}
                                </svg>
                            </div>

                            {/* 右側 控制面板與推導代數 */}
                            <div className="md:col-span-6 flex flex-col justify-between space-y-3">
                                <div>
                                    <div className="flex items-center justify-between text-xs mb-1 font-mono">
                                        <span className="text-amber-300 font-bold">拖拉拉點 x = <span className="text-lg text-amber-400 font-black">{xVal}</span></span>
                                        <span className="text-slate-400">(-2 至 4)</span>
                                    </div>
                                    <input 
                                        type="range" 
                                        min="-2" 
                                        max="4" 
                                        value={xVal} 
                                        onChange={(e) => setXVal(parseInt(e.target.value))} 
                                        className="w-full"
                                    />
                                </div>

                                <div className="space-y-2 font-mono text-xs">
                                    <div className="p-2.5 bg-slate-800/80 rounded-xl border border-sky-500/30">
                                        <span className="text-sky-300 font-sans text-[11px] font-bold block mb-0.5">左方 L.H.S. = {lhsExprStr}</span>
                                        <div className="text-slate-200">
                                            = {isIdentityMode ? `2(${xVal} + 3) + 3(${xVal} - 1) = 2(${xVal+3}) + 3(${xVal-1})` : `2(${xVal}) + 1`} = <span className="text-sky-400 font-bold text-sm">{lhsVal}</span>
                                        </div>
                                    </div>

                                    <div className="p-2.5 bg-slate-800/80 rounded-xl border border-emerald-500/30">
                                        <span className="text-emerald-300 font-sans text-[11px] font-bold block mb-0.5">右方 R.H.S. = {rhsExprStr}</span>
                                        <div className="text-slate-200">
                                            = {isIdentityMode ? `5(${xVal}) + 3` : `3`} = <span className="text-emerald-400 font-bold text-sm">{rhsVal}</span>
                                        </div>
                                    </div>
                                </div>

                                {/* 結論核心辨析 */}
                                <div className={`p-2.5 rounded-xl border text-xs font-sans font-bold leading-relaxed ${isEqual ? 'bg-emerald-950/60 border-emerald-500/50 text-emerald-200' : 'bg-rose-950/60 border-rose-500/50 text-rose-200'}`}>
                                    {isIdentityMode ? (
                                        <div>
                                            <span className="text-emerald-400 block font-black">✨ 恆等式 (Identity) 特性：</span>
                                            無論拖拉 $x$ 為任何數值，左方永遠等於右方 ($y_1 = y_2$)，兩條函數線在直角坐標平面上完全重合！故記作 $\equiv$。
                                        </div>
                                    ) : (
                                        <div>
                                            <span className="text-amber-400 block font-black">⚠️ 條件方程 (Equation) 特性：</span>
                                            只有當 $x = 1$ 時（交點），左方才等於右方！其餘任何 $x$ 值兩者均不相等。
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>
                    </div>
                );
            }

            return null;
        };

        const StepByStepQuizEngine = ({ lessonId, lang }) => {
            const [questions, setQuestions] = useState([]);
            const [qIndex, setQIndex] = useState(0);
            const [stepStatus, setStepStatus] = useState([]);
            const [currentActiveStep, setCurrentActiveStep] = useState(0);
            const [attemptsLeft, setAttemptsLeft] = useState([]);
            const [isQuizSummary, setIsQuizSummary] = useState(false);
            const [scoreHistory, setScoreHistory] = useState([]);

            const questionBank = useMemo(() => generateQuestionBank(lang), [lang]);

            useEffect(() => {
                const filtered = questionBank.filter(q => q.lessonId === lessonId);
                const shuffled = [...filtered].sort(() => Math.random() - 0.5).slice(0, 3);
                setQuestions(shuffled);
                setQIndex(0);
                setIsQuizSummary(false);
                setScoreHistory([]);
                if (shuffled.length > 0) {
                    initQuestionSteps(shuffled[0]);
                }
            }, [lessonId, lang]);

            const initQuestionSteps = (q) => {
                if (!q) return;
                const status = q.steps.map(() => ({ selectedOption: null, isCorrect: null, completed: false }));
                const attempts = q.steps.map(() => 2);
                setStepStatus(status);
                setAttemptsLeft(attempts);
                setCurrentActiveStep(0);
            };

            const currentQ = questions[qIndex];

            const handleSelectOption = (sIdx, option) => {
                if (sIdx !== currentActiveStep) return;
                const stepData = currentQ.steps[sIdx];
                const isCorrect = option === stepData.correct;

                const newStatus = [...stepStatus];
                const newAttempts = [...attemptsLeft];

                newStatus[sIdx].selectedOption = option;

                if (isCorrect) {
                    newStatus[sIdx].isCorrect = true;
                    newStatus[sIdx].completed = true;
                } else {
                    newAttempts[sIdx] -= 1;
                    if (newAttempts[sIdx] <= 0) {
                        newStatus[sIdx].isCorrect = false;
                        newStatus[sIdx].completed = true;
                    } else {
                        newStatus[sIdx].isCorrect = false;
                    }
                }

                setStepStatus(newStatus);
                setAttemptsLeft(newAttempts);
            };

            const handleNextStep = () => {
                setCurrentActiveStep(prev => prev + 1);
            };

            const handleNextQuestion = () => {
                const correctCount = stepStatus.filter(s => s.isCorrect).length;
                const totalSteps = stepStatus.length;
                const questionScore = Math.round((correctCount / totalSteps) * 100);

                const newHistory = [...scoreHistory, { qIndex, score: questionScore }];
                setScoreHistory(newHistory);

                if (qIndex < questions.length - 1) {
                    const nextQIdx = qIndex + 1;
                    setQIndex(nextQIdx);
                    initQuestionSteps(questions[nextQIdx]);
                } else {
                    setIsQuizSummary(true);
                }
            };

            const handleRestartQuiz = () => {
                const filtered = questionBank.filter(q => q.lessonId === lessonId);
                const shuffled = [...filtered].sort(() => Math.random() - 0.5).slice(0, 3);
                setQuestions(shuffled);
                setQIndex(0);
                setIsQuizSummary(false);
                setScoreHistory([]);
                if (shuffled.length > 0) {
                    initQuestionSteps(shuffled[0]);
                }
            };

            if (!currentQ && !isQuizSummary) {
                return <div className="p-8 text-center text-slate-500 font-bold">{T(lang, "載入題目中...", "Loading questions...")}</div>;
            }

            if (isQuizSummary) {
                const avgScore = Math.round(scoreHistory.reduce((a, b) => a + b.score, 0) / scoreHistory.length);
                return (
                    <div className="bg-white p-6 sm:p-8 rounded-2xl shadow-sm border border-slate-200 text-center animate-fade-in">
                        <div className="w-14 h-14 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto mb-3 text-2xl font-bold">
                            🏆
                        </div>
                        <h3 className="text-xl sm:text-2xl font-black text-slate-800 mb-1">{T(lang, "單元練習完成！", "Unit Practice Completed!")}</h3>
                        <p className="text-slate-600 text-xs sm:text-sm mb-5">{T(lang, "你已順利完成本單元 3 條分步訓練題。", "Completed 3 step-by-step training questions.")}</p>

                        <div className="bg-slate-50 p-5 rounded-xl border border-slate-200 max-w-xs mx-auto mb-5">
                            <span className="text-[11px] text-slate-500 uppercase font-bold tracking-wider">{T(lang, "平均表現得分", "Average Score")}</span>
                            <div className="text-3xl font-black text-indigo-600 mt-1">{avgScore}%</div>
                        </div>

                        <button onClick={handleRestartQuiz} className="px-5 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-sm rounded-xl shadow transition active:scale-95 flex items-center justify-center gap-2 mx-auto">
                            <IconRefresh /> <span>{T(lang, "再練一組新題目", "Try Another 3 Questions")}</span>
                        </button>
                    </div>
                );
            }

            return (
                <div className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden animate-fade-in">
                    {/* 頂部進度條 */}
                    <div className="p-3.5 sm:p-5 bg-slate-900 text-white flex justify-between items-center border-b border-slate-800 sticky top-0 z-20">
                        <div>
                            <span className="text-[10px] sm:text-xs text-amber-400 font-bold uppercase tracking-wider block">{currentQ.category}</span>
                            <h3 className="text-sm sm:text-base font-bold mt-0.5">{T(lang, `題目 ${qIndex + 1} / 3`, `Question ${qIndex + 1} / 3`)}</h3>
                        </div>
                        <div className="flex gap-1.5">
                            {[0, 1, 2].map(idx => (
                                <div key={idx} className={`w-2.5 h-2.5 rounded-full ${idx === qIndex ? 'bg-amber-400 ring-2 ring-amber-300' : (idx < qIndex ? 'bg-emerald-500' : 'bg-slate-700')}`} />
                            ))}
                        </div>
                    </div>

                    {/* 題目描述與學生答題推導簿 */}
                    <div className="p-4 sm:p-5 bg-slate-50 border-b border-slate-200">
                        <div className="text-sm sm:text-base font-bold text-slate-800 mb-3" dangerouslySetInnerHTML={{ __html: currentQ.title }}></div>
                        
                        {/* 學生答題推導過程 */}
                        <div className="bg-slate-900 text-slate-100 p-3.5 sm:p-4 rounded-xl font-mono text-xs sm:text-sm border border-slate-700 shadow-inner">
                            <div className="text-[11px] text-amber-400 font-sans font-bold mb-2.5 flex items-center justify-between border-b border-slate-800 pb-1.5">
                                <span className="flex items-center gap-1.5">
                                    <span>📝</span> {T(lang, "學生答題推導過程", "Student Step-by-Step Working")}:
                                </span>
                                <span className="text-[10px] bg-indigo-900/80 text-indigo-200 px-2 py-0.5 rounded border border-indigo-700/50 font-sans">
                                    {T(lang, "即時推導展示", "Live Progressive Deduction")}
                                </span>
                            </div>

                            <div className="space-y-2 pl-2 sm:pl-3 border-l-2 border-indigo-500/60 font-mono">
                                {/* 原題首行 */}
                                <div className="text-amber-300 font-bold tracking-wide flex items-center gap-2">
                                    <span className="text-slate-500 text-[10px] font-sans w-14 flex-shrink-0">{T(lang, "原式", "Expr")}</span>
                                    <span>{currentQ.rawExpr}</span>
                                </div>

                                {/* 各步驟推導 */}
                                {currentQ.steps.map((stepData, idx) => {
                                    const st = stepStatus[idx];
                                    if (!st) return null;

                                    const isCompleted = st.completed;
                                    const isCurrent = idx === currentActiveStep;

                                    if (isCompleted) {
                                        const correctAns = stepData.correct;
                                        const needsEquals = !correctAns.startsWith('=') && 
                                                           !correctAns.startsWith('左方') && 
                                                           !correctAns.startsWith('L.H.S.') && 
                                                           !correctAns.startsWith('右方') && 
                                                           !correctAns.startsWith('R.H.S.') && 
                                                           !correctAns.startsWith('比較') && 
                                                           !correctAns.startsWith('Comparing') && 
                                                           !correctAns.startsWith('(a)') && 
                                                           !correctAns.startsWith('(b)') && 
                                                           !correctAns.includes(' Expansion') && 
                                                           !correctAns.includes(' Factorization');

                                        const isFinalStep = idx === currentQ.steps.length - 1;

                                        return (
                                            <div key={idx} className={`font-bold animate-fade-in flex items-start gap-2 ${isFinalStep ? 'text-emerald-300 bg-emerald-950/40 p-1.5 rounded border border-emerald-800/50' : 'text-emerald-400'}`}>
                                                <span className="text-slate-400 text-[10px] font-sans w-14 flex-shrink-0 pt-0.5">
                                                    {isFinalStep ? T(lang, "最終結論", "Final") : T(lang, `步驟 ${idx + 1}`, `Step ${idx + 1}`)}
                                                </span>
                                                <span className="font-mono flex-1 leading-snug" dangerouslySetInnerHTML={{ __html: needsEquals ? `= ${correctAns}` : correctAns }}></span>
                                                <span className="text-emerald-400 text-xs ml-1 font-sans">✓</span>
                                            </div>
                                        );
                                    }

                                    if (isCurrent) {
                                        return (
                                            <div key={idx} className="text-amber-400/90 font-bold animate-pulse flex items-center gap-2 pt-0.5">
                                                <span className="text-slate-400 text-[10px] font-sans w-14 flex-shrink-0">{T(lang, `步驟 ${idx + 1}`, `Step ${idx + 1}`)}</span>
                                                <span className="bg-amber-400/20 px-2 py-0.5 rounded text-amber-300 border border-amber-400/30 text-xs font-sans">
                                                    = ? ({T(lang, "請點選下方選項解答", "Select option below")})
                                                </span>
                                            </div>
                                        );
                                    }

                                    return null;
                                })}
                            </div>
                        </div>
                    </div>

                    {/* 步驟題目內容 */}
                    <div className="p-4 sm:p-5 space-y-4">
                        {currentQ.shortDivision && (
                            <ShortDivisionDiagram data={currentQ.shortDivision} stepStatus={stepStatus} lang={lang} />
                        )}

                        {currentQ.steps.map((stepData, sIdx) => {
                            const status = stepStatus[sIdx]; if (!status) return null;
                            const isVisible = sIdx <= currentActiveStep; if (!isVisible) return null;
                            const isCurrent = sIdx === currentActiveStep; 
                            const isCompleted = status.completed; 
                            const isLastStep = sIdx === currentQ.steps.length - 1;

                            if (!isCurrent && isCompleted) {
                                return (
                                    <div key={sIdx} className="p-3 bg-emerald-50/70 border border-emerald-200 rounded-xl text-xs sm:text-sm flex items-center justify-between gap-2 animate-fade-in">
                                        <div className="flex items-center gap-2 overflow-hidden">
                                            <span className="w-5 h-5 rounded-full bg-emerald-600 text-white text-[11px] font-bold flex items-center justify-center flex-shrink-0">{sIdx + 1}</span>
                                            <span className="text-slate-700 font-medium truncate">{stepData.prompt}</span>
                                        </div>
                                        <div className="flex items-center gap-1 font-mono font-bold text-emerald-800 flex-shrink-0 bg-emerald-100 px-2.5 py-1 rounded-lg border border-emerald-300 text-xs">
                                            <IconCheck /> <span className="truncate max-w-[160px] sm:max-w-none" dangerouslySetInnerHTML={{ __html: stepData.correct }}></span>
                                        </div>
                                    </div>
                                );
                            }

                            return (
                                <div key={sIdx} className={`p-4 rounded-xl border-2 transition-all duration-300 ${isCurrent ? 'border-indigo-500 bg-indigo-50/20 ring-1 ring-indigo-100 shadow-sm' : 'border-slate-200 bg-slate-50'}`}>
                                    <div className="flex items-start justify-between mb-2.5 w-full">
                                        <div className={`font-bold text-xs sm:text-sm flex items-start gap-2 flex-1 ${isCurrent ? 'text-indigo-900' : 'text-slate-700'}`}>
                                            <span className={`w-5 h-5 mt-0.5 rounded-full text-white text-[11px] flex items-center justify-center font-bold flex-shrink-0 ${isCurrent ? 'bg-indigo-600' : 'bg-slate-400'}`}>{sIdx + 1}</span>
                                            <div className="flex-1" dangerouslySetInnerHTML={{ __html: stepData.prompt }}></div>
                                        </div>
                                    </div>

                                    {/* 選項列表 */}
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-2 mt-2">
                                        {stepData.options.map((opt, optIdx) => {
                                            let btnStyle = "border-slate-200 bg-white hover:border-indigo-400 hover:bg-indigo-50/50 text-slate-700";
                                            if (status.selectedOption === opt) {
                                                if (opt === stepData.correct) { btnStyle = "border-emerald-500 bg-emerald-50 text-emerald-900 font-bold ring-1 ring-emerald-300"; } 
                                                else { btnStyle = "border-rose-500 bg-rose-50 text-rose-900 font-bold"; }
                                            } else if (isCompleted && opt === stepData.correct) { 
                                                btnStyle = "border-emerald-500 bg-emerald-50 text-emerald-800 font-bold"; 
                                            }

                                            return (
                                                <button key={optIdx} onClick={() => handleSelectOption(sIdx, opt)} disabled={!isCurrent || isCompleted} className={`p-3 rounded-xl border text-left font-serif text-xs sm:text-sm font-bold tracking-wide transition-all flex justify-between items-center gap-2 ${btnStyle} ${(!isCurrent || isCompleted) ? 'cursor-default' : ''}`}>
                                                    <span className="flex-1 break-words leading-relaxed" dangerouslySetInnerHTML={{ __html: opt }}></span>
                                                    {status.selectedOption === opt && opt === stepData.correct && <IconCheck />}
                                                    {status.selectedOption === opt && opt !== stepData.correct && <IconCross />}
                                                </button>
                                            );
                                        })}
                                    </div>

                                    {/* 答錯提示 */}
                                    {status.isCorrect === false && !isCompleted && (
                                        <div className="mt-2.5 p-2.5 bg-amber-50 border border-amber-300 rounded-lg flex items-center justify-between text-xs text-amber-900 animate-pulse-subtle">
                                            <div className="flex items-center gap-1"><IconLightbulb /><span>{T(lang, "答錯了！請再試一次。", "Incorrect! Try again.")}</span></div>
                                            <button onClick={() => { const newStatus = [...stepStatus]; newStatus[sIdx].selectedOption = null; setStepStatus(newStatus); }} className="px-2.5 py-1 bg-amber-600 text-white text-[11px] font-bold rounded-lg hover:bg-amber-700 transition">{T(lang, "重試", "Retry")}</button>
                                        </div>
                                    )}

                                    {/* 解釋說明 */}
                                    {isCompleted && (
                                        <div className={`mt-3 p-3 border rounded-xl text-xs ${isLastStep ? 'bg-blue-50/90 border-blue-200 text-blue-950' : 'bg-emerald-50/80 border-emerald-200 text-emerald-950'}`}>
                                            <p className={`font-bold mb-1 flex items-center gap-1 ${isLastStep ? 'text-blue-900' : 'text-emerald-800'}`}>
                                                <IconLightbulb /> {isLastStep ? T(lang, "最終解答解說：", "Final Explanation:") : T(lang, `步驟 ${sIdx + 1} 解說：`, `Step ${sIdx + 1} Explanation:`)}
                                            </p>
                                            <div className="font-sans leading-relaxed" dangerouslySetInnerHTML={{ __html: stepData.explanation }}></div>
                                            
                                            {isCurrent && !isLastStep && (
                                                <button onClick={handleNextStep} className="mt-3 px-4 py-2 bg-indigo-600 text-white font-bold text-xs rounded-xl shadow hover:bg-indigo-700 transition flex items-center gap-1 w-full justify-center">
                                                    {T(lang, `進入【步驟 ${sIdx + 2}】`, `Proceed to [Step ${sIdx + 2}]`)} <IconArrowRight />
                                                </button>
                                            )}
                                            
                                            {isCurrent && isLastStep && (
                                                <div className="mt-3 pt-2.5 border-t border-blue-200 flex flex-col sm:flex-row justify-between items-center gap-2">
                                                    <span className="text-emerald-700 font-bold flex items-center gap-1 text-xs">🎉 {T(lang, "本題完成！已成功推導至最終答案。", "Question completed! Successfully deduced final answer.")}</span>
                                                    <button onClick={handleNextQuestion} className="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs rounded-xl shadow transition active:scale-95 flex items-center gap-1 w-full sm:w-auto justify-center">
                                                        {qIndex < 2 ? T(lang, "下一條練習題", "Next Question") : T(lang, "查看練習總結", "View Summary")} <IconArrowRight />
                                                    </button>
                                                </div>
                                            )}
                                        </div>
                                    )}
                                </div>
                            );
                        })}
                    </div>
                </div>
            );
        };

        const App = () => {
            const [lang, setLang] = useState('zh');
            const [activeLessonId, setActiveLessonId] = useState("L1");
            const [isSidebarOpen, setIsSidebarOpen] = useState(true);

            const syllabus = getLessonSyllabus(lang);
            const activeLesson = syllabus.find(l => l.id === activeLessonId) || syllabus[0];

            const handleSelectLesson = (id) => {
                setActiveLessonId(id);
                setIsSidebarOpen(false);
            };

            return (
                <div className="min-h-screen flex bg-slate-100 overflow-x-hidden relative">
                    {!isSidebarOpen && (
                        <button
                            onClick={() => setIsSidebarOpen(true)}
                            className="fixed top-3 left-3 z-40 bg-white border border-slate-200 text-indigo-700 p-2.5 rounded-xl shadow-lg hover:bg-indigo-50 hover:border-indigo-300 transition-all flex items-center justify-center gap-1.5 group animate-fade-in focus:outline-none"
                        >
                            <IconMenu />
                            <span className="font-bold text-xs hidden sm:inline-block group-hover:text-indigo-800">
                                {T(lang, "單元選單", "Lessons")}
                            </span>
                        </button>
                    )}

                    {isSidebarOpen && (
                        <div
                            className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-40 md:hidden transition-opacity"
                            onClick={() => setIsSidebarOpen(false)}
                        />
                    )}

                    <aside className={`fixed inset-y-0 left-0 z-50 w-72 sm:w-80 bg-slate-900 text-slate-100 flex flex-col shadow-2xl transition-transform duration-300 ease-out transform ${isSidebarOpen ? 'translate-x-0' : '-translate-x-full'}`}>
                        <div className="p-4 bg-slate-950 border-b border-slate-800 flex justify-between items-start">
                            <div>
                                <span className="text-[10px] font-bold text-indigo-400 uppercase tracking-wider">{T(lang, "F.2 中二數學 Ch.2", "F.2 Math Ch.2")}</span>
                                <h1 className="text-base sm:text-lg font-black mt-0.5 text-white">{T(lang, "恆等式與因式分解", "Identities & Factorization")}<br/><span className="text-amber-400 text-xs font-normal">{T(lang, "分步訓練平台", "Step-by-Step Platform")}</span></h1>
                            </div>
                            <button onClick={() => setIsSidebarOpen(false)} className="text-slate-400 hover:text-white p-1 rounded-full hover:bg-slate-800 transition-colors">
                                <IconCross />
                            </button>
                        </div>

                        <div className="p-2.5 bg-slate-900 border-b border-slate-800 flex justify-center gap-2">
                            <button onClick={() => setLang('zh')} className={`px-3 py-1 rounded-lg text-xs font-bold transition-colors ${lang === 'zh' ? 'bg-indigo-600 text-white shadow' : 'bg-slate-800 text-slate-400 hover:bg-slate-700'}`}>中文</button>
                            <button onClick={() => setLang('en')} className={`px-3 py-1 rounded-lg text-xs font-bold transition-colors ${lang === 'en' ? 'bg-indigo-600 text-white shadow' : 'bg-slate-800 text-slate-700 hover:bg-slate-700'}`}>English</button>
                        </div>

                        <nav className="flex-1 overflow-y-auto p-2.5 space-y-1 hide-scrollbar">
                            <div className="text-[11px] font-bold text-slate-500 px-2.5 pt-1 pb-1 uppercase">{T(lang, "課堂單元 (共14單元)", "Lessons (14 Units)")}</div>
                            {syllabus.map((lesson) => {
                                const isActive = lesson.id === activeLessonId;
                                return (
                                    <button
                                        key={lesson.id}
                                        onClick={() => handleSelectLesson(lesson.id)}
                                        className={`w-full text-left p-2.5 rounded-xl transition flex flex-col ${isActive ? 'bg-indigo-600 text-white font-bold shadow ring-1 ring-indigo-400' : 'hover:bg-slate-800 text-slate-300'}`}
                                    >
                                        <span className="text-xs sm:text-sm">{lesson.title}</span>
                                        <span className={`text-[10px] mt-0.5 ${isActive ? 'text-indigo-200' : 'text-slate-500'}`}>{lesson.category}</span>
                                    </button>
                                );
                            })}
                        </nav>

                        <div className="p-2.5 bg-slate-950 border-t border-slate-800 text-[11px] text-slate-400 text-center whitespace-pre-line">
                            {T(lang, "中二數學教學流程\nStep-by-Step 引導訓練", "F.2 Math Curriculum\nStep-by-Step Guided Training")}
                        </div>
                    </aside>

                    <main className={`flex-1 min-h-screen overflow-y-auto transition-all duration-300 ease-out w-full ${isSidebarOpen ? 'md:ml-80' : 'ml-0'}`}>
                        <div className={`p-3.5 md:p-6 max-w-4xl mx-auto w-full transition-all duration-300 ${!isSidebarOpen ? 'pt-16 md:pt-6' : 'pt-3 md:pt-6'}`}>
                            <div className="bg-white p-4 sm:p-5 rounded-2xl shadow-sm border border-slate-200 mb-4">
                                <div className="flex items-center gap-2 mb-1">
                                    <span className="bg-indigo-100 text-indigo-800 text-[11px] font-bold px-2 py-0.5 rounded-full">{activeLesson.category}</span>
                                    <span className="text-[11px] text-slate-400">{T(lang, "當前單元", "Current Lesson")}</span>
                                </div>
                                <h2 className="text-lg sm:text-xl font-black text-slate-800">{activeLesson.title}</h2>
                                <p className="text-slate-600 text-xs sm:text-sm mt-1 leading-relaxed">{activeLesson.desc}</p>
                            </div>

                            <ConceptVisualizer lessonId={activeLessonId} lang={lang} />
                            <StepByStepQuizEngine lessonId={activeLessonId} lang={lang} />
                        </div>
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
